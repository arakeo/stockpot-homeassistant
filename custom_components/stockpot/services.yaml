consume_product:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: stockpot
    ean:
      example: "3033490004743"
      selector:
        text:
    product_id:
      selector:
        number:
          min: 1
          mode: box
    quantity:
      example: 1
      selector:
        number:
          min: 0.001
          step: any
          mode: box
    unit_id:
      selector:
        number:
          min: 1
          mode: box
    location_id:
      selector:
        number:
          min: 1
          mode: box

