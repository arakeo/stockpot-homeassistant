plan_meal:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: stockpot
    date:
      required: true
      selector:
        date:
    meal_type:
      required: true
      selector:
        select:
          translation_key: meal_type
          options:
            - breakfast
            - lunch
            - snack
            - dinner
    recipe_id:
      selector:
        number:
          min: 1
          mode: box
    note:
      example: "Pizza maison"
      selector:
        text:
    servings:
      selector:
        number:
          min: 0.5
          max: 99
          step: 0.5
          mode: box

cook_meal:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: stockpot
    entry_id:
      selector:
        number:
          min: 1
          mode: box
    date:
      selector:
        date:
    meal_type:
      selector:
        select:
          translation_key: meal_type
          options:
            - breakfast
            - lunch
            - snack
            - dinner

generate_shopping_list:
  fields:
